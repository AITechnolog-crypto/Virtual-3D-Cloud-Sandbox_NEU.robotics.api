<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Vision</title>
  <style>
    html,body{margin:0;height:100%;background:#000}
    #v{display:none}
    #c{width:100%;height:100%}
  </style>
</head>
<body>
<video id="v" autoplay playsinline muted></video>
<canvas id="c"></canvas>
<script>
(async()=>{
  try{
    const v=document.getElementById('v'), c=document.getElementById('c'), x=c.getContext('2d');
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:320},height:{ideal:240},facingMode:'environment'},audio:false});
    v.srcObject=stream; await v.play();
    function loop(){
      const w=c.width=innerWidth, h=c.height=innerHeight, sw=v.videoWidth||320, sh=v.videoHeight||240;
      const s=Math.min(w/sw,h/sh), dw=(sw*s)|0, dh=(sh*s)|0, ox=((w-dw)/2)|0, oy=((h-dh)/2)|0;
      x.drawImage(v,ox,oy,dw,dh);
      const img=x.getImageData(ox,oy,dw,dh), d=img.data;
      let cnt=0, sx=0, sy=0;
      for(let i=0;i<d.length;i+=4){
        const r=d[i], g=d[i+1], b=d[i+2];
        const max=Math.max(r,g,b), min=Math.min(r,g,b), C=max-min;
        let H=0; if(C>0){ if(max===r) H=((g-b)/C)%6; else if(max===g) H=(b-r)/C+2; else H=(r-g)/C+4; H*=60; if(H<0)H+=360; }
        const S=max?C/max:0;
        if(H>340||H<20){ if(S>0.4 && max>80){
          const idx=(i>>2); const px=idx%dw, py=(idx/dw)|0; cnt++; sx+=px; sy+=py;
        }}
      }
      if(cnt>100){
        const cx=sx/cnt, cy=sy/cnt, size=cnt/(dw*dh);
        try{
          parent.postMessage({ type:'vision:blob', payload:{ x:(cx/dw)*2-1, y:(cy/dh)*2-1, size } }, '*');
        }catch(_){ }
        // draw reticle
        x.strokeStyle='#0f0'; x.beginPath(); x.arc(ox+cx,oy+cy,Math.max(8,Math.sqrt(cnt)),0,Math.PI*2); x.stroke();
      }
      requestAnimationFrame(loop);
    }
    loop();
  }catch(e){
    console.warn('Vision init failed', e);
  }
})();
</script>
</body>
</html>
