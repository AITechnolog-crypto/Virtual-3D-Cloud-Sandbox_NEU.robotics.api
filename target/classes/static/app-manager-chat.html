<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>App Manager Chat</title>
  <style>
    #chatButton {
      position: fixed;
      right: 18px;
      bottom: 18px;
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: #2c3e50;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 9999;
      font-weight: 700;
      user-select: none;
    }
    #chatPanel {
      position: fixed;
      right: 18px;
      bottom: 86px;
      width: 340px;
      max-height: 60vh;
      background: #ffffff;
      border: 1px solid #ddd;
      box-shadow: 0 6px 24px rgba(0,0,0,0.15);
      display: none;
      flex-direction: column;
      z-index: 9999;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }
    #chatMessages { flex: 1; overflow:auto; padding: 10px; font-size: 14px; }
    #chatInput { display:flex; gap:8px; padding:8px; border-top:1px solid #eee; }
    #chatInput input { flex:1; padding:8px; border:1px solid #e5e7eb; border-radius:4px }
    #chatInput button { padding:8px 12px; border:0; border-radius:4px; background:#111827; color:#fff; cursor:pointer }
    .msg-user { text-align: right; color:#0b69ff; margin:6px 0; }
    .msg-bot { text-align: left; color:#222; margin:6px 0; }
    #consentRow { border-top: 1px solid #eee; padding: 8px; font-size: 12px; color:#374151; background:#fafafa; display:flex; gap:8px; align-items:center; justify-content:space-between }
    #consentRow button { padding:4px 8px; border:1px solid #e5e7eb; background:#fff; border-radius:4px; cursor:pointer }
  </style>
</head>
<body>
  <div id="chatButton" title="App Manager Chat">M</div>

  <div id="chatPanel" aria-hidden="true">
    <div id="ctxInfo" style="padding:6px 8px;border-bottom:1px solid #eee;font:12px system-ui;color:#374151;display:none"></div>
    <div id="chatMessages"></div>
    <div id="chatInput">
      <input id="inputText" placeholder="Schreibe etwas..." />
      <button id="sendBtn">Senden</button>
    </div>
    <div id="consentRow">
      <div>Standardkonsent erforderlich.</div>
      <button id="acceptBtn">Akzeptieren</button>
    </div>
  </div>

  <script>
    const chatButton = document.getElementById('chatButton');
    const chatPanel = document.getElementById('chatPanel');
    const chatMessages = document.getElementById('chatMessages');
    const inputText = document.getElementById('inputText');
    const sendBtn = document.getElementById('sendBtn');
    const acceptBtn = document.getElementById('acceptBtn');
    const consentRow = document.getElementById('consentRow');
    const ctxInfo = document.getElementById('ctxInfo');
    let WSCTX = null;
    // signal readiness to parent (java-interface)
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ ns:'JavaWorkspaceV1', type:'ready' }, '*'); } } catch(_) {}
    // accept context from parent
    window.addEventListener('message', (ev)=>{
      try{
        const d = ev.data||{};
        if (d && d.ns==='JavaWorkspaceV1' && d.type==='context'){
          WSCTX = d;
          if (ctxInfo){
            const n = Array.isArray(d.snippets)? d.snippets.length : 0;
            const titles = (d.snippets||[]).slice(0,3).map(s=> s.title||'').filter(Boolean).join(' • ');
            ctxInfo.textContent = `Workspace: Kontext=${d.context?'an':'aus'} · Auto‑Ingest=${d.autoIngest?'an':'aus'} · Snippets=${n}` + (titles? ` (${titles})` : '');
            ctxInfo.style.display = 'block';
          }
        }
      }catch(_){ }
    });

    // einfache Session-ID lokal
    let sessionId = localStorage.getItem('appmgr.session');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('appmgr.session', sessionId);
    }

    chatButton.addEventListener('click', () => {
      const visible = chatPanel.style.display === 'flex';
      chatPanel.style.display = visible ? 'none' : 'flex';
      chatPanel.setAttribute('aria-hidden', visible ? 'true' : 'false');
      if (!visible) {
        inputText.focus();
        // Warmup Ping (best-effort)
        fetch('/api/warmup', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sessionId }) }).catch(()=>{});
      }
    });

    function appendMessage(text, who) {
      const div = document.createElement('div');
      div.className = who === 'user' ? 'msg-user' : 'msg-bot';
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      let text = inputText.value.trim();
      if (!text) return;
      // Workspace‑Kontext ggf. voranstellen
      try{
        if (WSCTX && WSCTX.context && Array.isArray(WSCTX.snippets) && WSCTX.snippets.length){
          const preview = WSCTX.snippets.slice(0,3).map(s=> `• ${s.title||''} [${(s.tags||[]).join(', ')}]`).join('\n');
          text = `Kontext:\n${preview}\n\n` + text;
        }
      }catch(_){ }
      appendMessage(text, 'user');
      inputText.value = '';
      appendMessage('...', 'bot'); // placeholder while waiting

      try {
        const resp = await fetch('/api/chat/assist', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ channel: 'customer', role: 'user', sender: 'user', message: text })
        });
        const data = await resp.json();
        const last = chatMessages.lastChild;
        if (last && last.textContent === '...') last.textContent = (data && data.reply) || 'Keine Antwort';
        else appendMessage((data && data.reply) || 'Keine Antwort', 'bot');
      } catch (e) {
        const last = chatMessages.lastChild;
        const msg = 'Fehler: ' + (e.message || 'Netzwerk');
        if (last && last.textContent === '...') last.textContent = msg; else appendMessage(msg, 'bot');
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputText.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

    // Consent speichern
    acceptBtn.addEventListener('click', async () => {
      try {
        await fetch('/api/consent', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ sessionId }) });
        appendMessage('Konsent gespeichert. Ich bin bereit als Shop Manager.', 'bot');
      } catch (_) {
        appendMessage('Lokaler Modus aktiv – Konsent wird lokal angenommen.', 'bot');
      } finally {
        try{ consentRow.style.display = 'none'; }catch(_){ }
      }
    });
  </script>
</body>
</html>
