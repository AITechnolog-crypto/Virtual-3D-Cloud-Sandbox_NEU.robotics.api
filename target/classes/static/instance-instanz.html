<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Instanz – Alpha (Satellit & Echtzeit)</title>
<link rel="stylesheet" href="LineLuxSharedStyles.css">
<style>
  :root{ --accent:#a8ffdf; --bg:#0a0f16; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:#e8f2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
  header{position:sticky;top:0;z-index:10;background:rgba(10,15,22,.85);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
  .wrap{max-width:1200px;margin:0 auto;padding:12px 16px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{margin:0;font-size:18px;background:linear-gradient(90deg,var(--accent),#00ccff);-webkit-background-clip:text;color:transparent}
  nav a{color:#a8ffdf;margin-right:12px;text-decoration:none}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .stat .lbl{color:#9fb0c6;font-size:12px}
  .stat .val{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--accent),#00ccff);-webkit-background-clip:text;color:transparent}
  #map{width:100%;height:420px;border-radius:10px;overflow:hidden}
  #cam{width:100%;height:420px;border-radius:10px;background:#000;display:block}
  .muted{color:#9fb0c6;font-size:12px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .btn{background:linear-gradient(135deg,var(--accent),#00ccff);color:#000;border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}
  .ghost{background:rgba(255,255,255,.08);color:#e8f2ff;border:1px solid rgba(255,255,255,.15)}
  @media (max-width:960px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="wrap" style="display:flex;justify-content:space-between;align-items:center">
    <div class="brand"><div>🛰️</div><h1>Instanz – Alpha</h1></div>
    <nav>
      <a href="linelux-style.html">Haupt‑UI</a>
      <a href="instances-index.html">Instanzen‑Index</a>
      <a href="variants/variants-index.html">Varianten</a>
    </nav>
  </div>
</header>
<div class="wrap">
  <div class="card">
    <div class="stats">
      <div class="stat"><div class="lbl">⚡ Energie</div><div class="val" id="stEnergy">–</div></div>
      <div class="stat"><div class="lbl">🚁 Drohnen</div><div class="val" id="stDrones">–</div></div>
      <div class="stat"><div class="lbl">🤖 Roboter</div><div class="val" id="stRobots">–</div></div>
      <div class="stat"><div class="lbl">🦗 Tarngrillen</div><div class="val" id="stGrylls">–</div></div>
      <div class="stat"><div class="lbl">🎯 Threats</div><div class="val" id="stThreats">0</div></div>
    </div>
    <div class="muted" id="providerHint" style="margin-top:6px">Karte wird initialisiert…</div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="toolbar">
        <button class="btn" id="btnGoogle">Google Maps</button>
        <button class="btn ghost" id="btnLeaflet">Leaflet</button>
        <button class="btn ghost" id="btnSat">Satellit</button>
        <button class="btn ghost" id="btnHybrid">Hybrid</button>
      </div>
      <div id="map" aria-label="Karte mit Tracking"></div>
    </div>
    <div class="card">
      <div class="toolbar" style="justify-content:space-between">
        <div class="muted">Modus:</div>
        <div style="display:flex;gap:8px">
          <button class="btn ghost" id="btnCam">Kamera</button>
          <button class="btn" id="btnRadar">Radar</button>
        </div>
      </div>
      <canvas id="cam" aria-label="Kamera Simulation" style="display:none"></canvas>
      <canvas id="radar" aria-label="Radar (High-Res)" style="width:100%;height:420px;border-radius:10px;background:#000;display:block"></canvas>
    </div>
  </div>
</div>

<script>
// Service Worker für lokale Mock‑APIs
if ('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw-mock-api.js').catch(()=>{});
  });
}

const API = location.origin + '/api';
const LS_GMAPS_KEY = 'gmaps_key';
let mapProvider = localStorage.getItem('map_provider') || 'auto';
let gmKey = localStorage.getItem(LS_GMAPS_KEY) || '';
let map, gmap, leaflet, leafletLayer;
let droneMarkers = [], gryllMarkers = [];
let drones = [
  { id:'D-01', lat:45.81, lng:15.98 },
  { id:'D-02', lat:44.98, lng:16.08 },
  { id:'D-03', lat:43.85, lng:18.41 }
];
let grylls = Array.from({length:8}, (_,i)=>({ id:'G-'+String(i+1).padStart(2,'0'), lat:44.0+Math.random()*2, lng:15.0+Math.random()*4 }));
let threats = 0;

function setText(id, txt){ const el=document.getElementById(id); if(el) el.textContent = txt; }
function fmt(n){ try{ return Number(n).toLocaleString('de-DE'); }catch(e){ return String(n); } }

async function pollStats(){
  try{ const r = await fetch(API + '/telemetry/status',{cache:'no-store'}); const j = await r.json(); setText('stEnergy', fmt(j.metrics && j.metrics.energy) + ' kWh'); }catch(e){}
  try{ const r = await fetch(API + '/drones/count'); const n = await r.json(); setText('stDrones', fmt(n)); }catch(e){ setText('stDrones', fmt(drones.length)); }
  try{ const r = await fetch(API + '/robots/count'); const n = await r.json(); setText('stRobots', fmt(n)); }catch(e){ setText('stRobots', '2'); }
  setText('stGrylls', fmt(grylls.length));
  if (Math.random()>0.985){ threats++; setText('stThreats', String(threats)); }
}

function loadLeaflet(cb){
  if (window.L){ cb(); return; }
  const link = document.createElement('link'); link.rel='stylesheet'; link.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(link);
  const s = document.createElement('script'); s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; s.defer=true; s.onload=cb; document.head.appendChild(s);
}
function loadGoogle(cb){
  if (window.google && window.google.maps){ cb(); return; }
  if (!gmKey){ gmKey = prompt('Google Maps API‑Key (für Satellit):','')||''; if(gmKey) localStorage.setItem(LS_GMAPS_KEY, gmKey); }
  if (!gmKey){ cb(new Error('no-key')); return; }
  const s=document.createElement('script'); s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(gmKey); s.async=true; s.defer=true; s.onload=()=>cb(); s.onerror=()=>cb(new Error('gmaps-load-failed')); document.head.appendChild(s);
}

function useLeaflet(){ mapProvider='leaflet'; localStorage.setItem('map_provider','leaflet'); const hint=document.getElementById('providerHint'); if(hint) hint.textContent='Leaflet/OSM aktiv (kein Google‑Key)'; loadLeaflet(()=>{ try{
    leaflet = L.map('map').setView([45.81,15.98], 4);
    leafletLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:19, attribution:'&copy; OpenStreetMap' });
    leafletLayer.addTo(leaflet);
    addAllMarkers('leaflet');
  }catch(e){} }); }

function useGoogle(type){ mapProvider='google'; localStorage.setItem('map_provider','google'); const hint=document.getElementById('providerHint'); if(hint) hint.textContent='Google Maps aktiv (Satellit)'; loadGoogle((err)=>{ if(err){ useLeaflet(); return; } try{
    gmap = new google.maps.Map(document.getElementById('map'), { center:{lat:45.81,lng:15.98}, zoom:5, mapTypeId: type||'satellite', tilt:67.5 });
    addAllMarkers('google');
  }catch(e){ useLeaflet(); } }); }

function addAllMarkers(provider){
  clearMarkers();
  if (provider==='google'){
    drones.forEach(d=>{ const m = new google.maps.Marker({ position:{lat:d.lat,lng:d.lng}, map:gmap, title:d.id }); droneMarkers.push(m); });
    grylls.forEach(g=>{ const m = new google.maps.Marker({ position:{lat:g.lat,lng:g.lng}, map:gmap, title:g.id, icon:{ path: google.maps.SymbolPath.CIRCLE, scale:4, fillColor:'#a8ffdf', fillOpacity:0.9, strokeWeight:1, strokeColor:'#0a0' } }); gryllMarkers.push(m); });
  } else {
    drones.forEach(d=>{ const m = L.marker([d.lat,d.lng]).addTo(leaflet).bindPopup(d.id); droneMarkers.push(m); });
    grylls.forEach(g=>{ const m = L.circleMarker([g.lat,g.lng],{ radius:5, color:'#0a0', fillColor:'#a8ffdf', fillOpacity:0.9 }).addTo(leaflet).bindPopup(g.id); gryllMarkers.push(m); });
  }
}
function clearMarkers(){
  if (gmap){ droneMarkers.forEach(m=>m.setMap(null)); gryllMarkers.forEach(m=>m.setMap(null)); }
  if (leaflet){ droneMarkers.forEach(m=>{ try{ leaflet.removeLayer(m);}catch(_){} }); gryllMarkers.forEach(m=>{ try{ leaflet.removeLayer(m);}catch(_){} }); }
  droneMarkers=[]; gryllMarkers=[];
}

function stepObjects(){
  function jitter(o){ o.lat += (Math.random()-0.5)*0.06; o.lng += (Math.random()-0.5)*0.06; if(o.lat>85) o.lat=85; if(o.lat<-85) o.lat=-85; if(o.lng>180) o.lng=-180; if(o.lng<-180) o.lng=180; }
  drones.forEach(jitter); grylls.forEach(jitter);
  // Update markers
  if (mapProvider==='google' && gmap){ drones.forEach((d,i)=> droneMarkers[i] && droneMarkers[i].setPosition(new google.maps.LatLng(d.lat,d.lng))); grylls.forEach((g,i)=> gryllMarkers[i] && gryllMarkers[i].setPosition(new google.maps.LatLng(g.lat,g.lng))); }
  if (mapProvider==='leaflet' && leaflet){ drones.forEach((d,i)=> droneMarkers[i] && droneMarkers[i].setLatLng([d.lat,d.lng])); grylls.forEach((g,i)=> gryllMarkers[i] && gryllMarkers[i].setLatLng([g.lat,g.lng])); }
}

function initCam(){
  const c = document.getElementById('cam'); const ctx = c.getContext('2d');
  function resize(){ c.width = c.clientWidth; c.height = c.clientHeight; }
  window.addEventListener('resize', resize); resize();
  function draw(){
    const w=c.width, h=c.height; ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
    // grid
    ctx.strokeStyle='rgba(168,255,223,.15)'; ctx.lineWidth=1; for(let x=0;x<w;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); } for(let y=0;y<h;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    // REC
    ctx.fillStyle='#ff5566'; ctx.beginPath(); ctx.arc(18,18,6,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#e8f2ff'; ctx.font='12px ui-monospace,monospace'; ctx.fillText('REC', 30, 22);
    // draw objects projected
    function proj(lat,lng){ return { x: (lng+180)/360*w, y: (90-lat)/180*h }; }
    ctx.fillStyle='#66e0ff'; drones.forEach(d=>{ const p=proj(d.lat,d.lng); ctx.beginPath(); ctx.arc(p.x,p.y,4,0,Math.PI*2); ctx.fill(); ctx.fillText(d.id, p.x+6, p.y-6); });
    ctx.fillStyle='#a8ffdf'; grylls.forEach(g=>{ const p=proj(g.lat,g.lng); ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); });
    requestAnimationFrame(draw);
  }
  draw();
}

function initRadar(){
  try{
    const cv = document.getElementById('radar'); if(!cv) return;
    const ctx = cv.getContext('2d');
    let pxr = Math.min(window.devicePixelRatio||1, 2);
    function resize(){ const w=cv.clientWidth, h=cv.clientHeight; cv.width=Math.max(1,Math.floor(w*pxr)); cv.height=Math.max(1,Math.floor(h*pxr)); ctx.setTransform(pxr,0,0,pxr,0,0); }
    window.addEventListener('resize', resize); resize();
    function center(){ try{ if (window.gmap){ const c=gmap.getCenter(); return {lat:c.lat(), lng:c.lng()}; } if (window.leaflet){ const c=leaflet.getCenter(); return {lat:c.lat, lng:c.lng}; } }catch(_){} return {lat:45.81,lng:15.98}; }
    function project(lat,lng){ const c=center(); const dlat = lat - c.lat; const dlng = (lng - c.lng) * Math.cos(c.lat*Math.PI/180); return { x: dlng, y: -dlat }; }
    let angle = 0; const SCALE_DEG = 2.0; // 2° bis Rand
    function draw(){
      const w=cv.clientWidth, h=cv.clientHeight; const cx=w/2, cy=h/2; const r=Math.min(w,h)*0.46;
      // Fade Hintergrund
      ctx.fillStyle='#000'; ctx.globalAlpha=0.18; ctx.fillRect(0,0,w,h); ctx.globalAlpha=1;
      // Grid
      ctx.strokeStyle='rgba(168,255,223,.12)'; ctx.lineWidth=1;
      [0.25,0.5,0.75,1].forEach(k=>{ ctx.beginPath(); ctx.arc(cx,cy,r*k,0,Math.PI*2); ctx.stroke(); });
      for(let a=0;a<360;a+=30){ const rad=a*Math.PI/180; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(rad)*r, cy+Math.sin(rad)*r); ctx.stroke(); }
      // Sweep
      const sweepAng = angle; const sweepRad = sweepAng*Math.PI/180;
      const grad = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
      grad.addColorStop(0,'rgba(0,255,136,.18)'); grad.addColorStop(1,'rgba(0,255,136,0)');
      ctx.save(); ctx.translate(cx,cy); ctx.rotate(sweepRad); ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,0,Math.PI/36); ctx.closePath(); ctx.fillStyle=grad; ctx.fill(); ctx.restore();
      function blip(lat,lng,color){ const c=center(); const dlat=lat-c.lat; const dlng=(lng-c.lng)*Math.cos(c.lat*Math.PI/180); const m=Math.hypot(dlng/SCALE_DEG,dlat/SCALE_DEG); const rr = Math.min(1,m); const x = (dlng/SCALE_DEG)/ (m||1) * rr * r; const y = (-dlat/SCALE_DEG)/ (m||1) * rr * r; const bx=cx+x, by=cy+y; const bearing=(Math.atan2(y,x)*180/Math.PI+360)%360; const diff=Math.min(Math.abs(bearing-sweepAng),360-Math.abs(bearing-sweepAng)); const pulse = diff<6; ctx.fillStyle=color; ctx.beginPath(); ctx.arc(bx,by,pulse?3.8:2.4,0,Math.PI*2); ctx.fill(); if(pulse){ ctx.strokeStyle=color; ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(bx,by,8,0,Math.PI*2); ctx.stroke(); ctx.globalAlpha=1; } }
      try{ (window.drones||[]).forEach(d=> blip(d.lat,d.lng,'#66e0ff')); }catch(_){ }
      try{ (window.grylls||[]).forEach(g=> blip(g.lat,g.lng,'#a8ffdf')); }catch(_){ }
      // Center
      ctx.fillStyle='#0f0'; ctx.globalAlpha=0.7; ctx.beginPath(); ctx.arc(cx,cy,2.2,0,Math.PI*2); ctx.fill(); ctx.globalAlpha=1;
      angle = (angle + 1.2) % 360; requestAnimationFrame(draw);
    }
    draw();
  }catch(e){ /* no-op */ }
}
function showRadar(flag){ try{ const cam=document.getElementById('cam'); const rad=document.getElementById('radar'); if (cam) cam.style.display = flag? 'none':'block'; if (rad) rad.style.display = flag? 'block':'none'; }catch(_){ } }

function init(){
  // Provider Auswahl
  document.getElementById('btnGoogle').addEventListener('click', ()=> useGoogle('satellite'));
  document.getElementById('btnLeaflet').addEventListener('click', ()=> useLeaflet());
  document.getElementById('btnSat').addEventListener('click', ()=>{ if (gmap){ gmap.setMapTypeId('satellite'); try{ gmap.setTilt(67.5);}catch(_){} } });
  document.getElementById('btnHybrid').addEventListener('click', ()=>{ if (gmap){ gmap.setMapTypeId('hybrid'); try{ gmap.setTilt(67.5);}catch(_){} } });

  // Auto-Start
  if (gmKey){ useGoogle('satellite'); } else { useLeaflet(); }
  initCam(); initRadar(); showRadar(true);
  const bCam=document.getElementById('btnCam'), bRad=document.getElementById('btnRadar');
  if (bCam) bCam.addEventListener('click', ()=> showRadar(false));
  if (bRad) bRad.addEventListener('click', ()=> showRadar(true));
  pollStats(); setInterval(pollStats, 5000);
  setInterval(stepObjects, 2500);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
