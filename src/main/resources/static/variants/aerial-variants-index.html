<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aerial Varianten – Index (100)</title>
<link rel="stylesheet" href="../LineLuxSharedStyles.css">
<style>
  body{background:#0b0f18;color:#e8f2ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}
  h1{font-size:22px;margin:10px 0 14px;background:linear-gradient(90deg,#00ff88,#00ccff);-webkit-background-clip:text;color:transparent}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
  .card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}
  a{color:#a8ffdf;text-decoration:none}
  .muted{color:#a9b4c6;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Aerial Varianten (100) – Mock‑freundliche Demos</h1>
  <p class="muted">Diese Übersicht verlinkt 100 Aerial‑Varianten (av‑01 … av‑100). Fehlt eine Datei, liefert der Service Worker automatisch eine Minimal‑Seite.
  Zur Aerial‑Demo: <a href="../aerial-view.html">aerial-view.html</a> • Zur Haupt‑UI: <a href="../linelux-style.html">linelux‑style.html</a></p>
  <div id="list" class="grid"></div>
</div>
<script>
(function(){
  const list = document.getElementById('list');
  for(let i=1;i<=100;i++){
    const n = String(i).padStart(2,'0');
    const hue = Math.round((i/100)*360);
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = '<div style="font-weight:700;margin-bottom:6px;color:hsl('+hue+',85%,70%)">Aerial '+n+'</div>'+
      '<div class="muted">Thema '+hue+'° • Auto‑Seite</div>'+
      '<div style="margin-top:8px"><a href="av-'+n+'.html">Öffnen</a></div>';
    list.appendChild(div);
  }
})();
</script>
</body>
</html>
