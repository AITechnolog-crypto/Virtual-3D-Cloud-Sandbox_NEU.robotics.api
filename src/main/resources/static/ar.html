<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NurAR</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}
  #stage{position:fixed;inset:0}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6)}
  #ui{position:fixed;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
  button{background:#111;color:#eee;border:1px solid #333;padding:10px 12px;border-radius:8px}
  #info{position:fixed;top:8px;left:8px;color:#bbb;font-size:12px;white-space:pre-line}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<canvas id="stage"></canvas>
<div id="info"></div>
<div id="gate"><button id="start">Start</button></div>
<div id="ui">
  <button id="flip">Kamera wechseln</button>
  <button id="reset">Ausrichtung nullen</button>
  <button id="obj">Objekt wechseln</button>
</div>

<script src="https://unpkg.com/three@0.156.1/build/three.min.js"></script>
<script>
(function(){
  const info  = document.getElementById('info');
  const video = document.getElementById('cam');
  const canvas= document.getElementById('stage');
  const gate  = document.getElementById('gate');
  const btnStart=document.getElementById('start');
  const btnFlip =document.getElementById('flip');
  const btnReset=document.getElementById('reset');
  const btnObj  =document.getElementById('obj');

  let facing = 'environment';
  let stream = null;
  let target = null; // {lat,lng}

  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, powerPreference:'high-performance'});
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, 1, 0.01, 1000);
  camera.position.set(0,0,2);
  const amb = new THREE.AmbientLight(0xffffff, 0.8); scene.add(amb);
  const dir = new THREE.DirectionalLight(0xffffff, 0.7); dir.position.set(1,1,1); scene.add(dir);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x223344, 0.3));

  const group = new THREE.Group(); scene.add(group);
  let mesh = null;
  function makeCube(){ if (mesh) group.remove(mesh); mesh = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), new THREE.MeshStandardMaterial({color:0x55ccff, roughness:0.4, metalness:0.2})); group.add(mesh); }
  function makeRing(){ if (mesh) group.remove(mesh); mesh = new THREE.Mesh(new THREE.TorusGeometry(0.5,0.18,24,64), new THREE.MeshStandardMaterial({color:0xffaa33, roughness:0.2, metalness:0.6})); group.add(mesh); }
  makeCube();

  function fit(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); camera.aspect = w/h; camera.updateProjectionMatrix(); }
  addEventListener('resize', fit); fit();

  // Device Orientation
  let baseQuat = new THREE.Quaternion();
  let currentQuat = new THREE.Quaternion();
  function eulerToQuat(a,b,g){ const d = Math.PI/180; const e = new THREE.Euler((b||0)*d,(a||0)*d,-(g||0)*d,'YXZ'); const q = new THREE.Quaternion(); q.setFromEuler(e); return q; }
  function onOrientation(ev){ const q = eulerToQuat(ev.alpha, ev.beta, ev.gamma); currentQuat.slerp(q, 0.15).premultiply(baseQuat); group.setRotationFromQuaternion(currentQuat); }
  function resetOrientation(){ baseQuat.identity(); }

  // Kamera
  async function startCam(){
    if (stream) stream.getTracks().forEach(t=>t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:facing,width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}, audio:false });
    video.srcObject = stream; await video.play();
    video.style.transform = facing==='user' ? 'scaleX(-1)' : 'none';
    gate.style.display = 'none';
  }

  // Geolokation anfordern und an Hub melden
  if ('geolocation' in navigator){
    navigator.geolocation.watchPosition(p=>{
      const lat = p.coords.latitude, lng = p.coords.longitude, acc = p.coords.accuracy;
      try { window.parent.postMessage({type:'ar:position', lat, lng, acc}, '*'); } catch(_){ }
      info.textContent = 'AR Position ' + lat.toFixed(5) + ' ' + lng.toFixed(5);
    }, e=>{}, {enableHighAccuracy:true, maximumAge:5000, timeout:10000});
  }

  // Ziel aus Hub empfangen
  window.addEventListener('message', ev=>{
    const m = ev.data || {};
    if (m.type === 'hub:setTarget'){
      target = {lat:m.lat, lng:m.lng};
      info.textContent = 'Ziel gesetzt ' + m.lat.toFixed(5) + ' ' + m.lng.toFixed(5);
    }
  });

  // Render
  let tPrev = performance.now();
  function tick(){ const t = performance.now(), dt = (t - tPrev) / 1000; tPrev = t; if (mesh){ mesh.rotation.y += dt * 0.5; } renderer.render(scene, camera); requestAnimationFrame(tick); }
  tick();

  // UI
  btnStart.onclick = async ()=>{
    try{
      if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission==='function'){
        await DeviceOrientationEvent.requestPermission().catch(()=>null);
      }
      addEventListener('deviceorientation', onOrientation);
      await startCam();
      try { window.parent.postMessage({type:'ar:status', msg:'gestartet'}, '*'); } catch(_){ }
    }catch(e){
      try { window.parent.postMessage({type:'ar:status', msg:'fehler '+e}, '*'); } catch(_){}
    }
  };
  btnFlip.onclick  = ()=>{ facing = (facing==='environment') ? 'user' : 'environment'; startCam(); };
  btnReset.onclick = ()=> resetOrientation();
  btnObj.onclick   = ()=>{ if (mesh && mesh.geometry.type==='BoxGeometry') makeRing(); else makeCube(); };
})();
</script>
</body>
</html>
